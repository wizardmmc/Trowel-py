name: macOS package Gate

on:
  pull_request:
    paths:
      - ".github/workflows/macos-package.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "trowel_py/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Apple Silicon package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Install locked frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build app, DMG and release metadata
        working-directory: web
        run: bun run make:mac
      - name: Run packaged app smoke
        working-directory: web
        run: bun run smoke:packaged-mac
      - name: Run default application data path smoke
        working-directory: web
        run: bun run smoke:packaged-default-paths-mac
      - name: Run close and reopen residency smoke
        working-directory: web
        run: bun run smoke:packaged-residency-mac
      - name: Run DMG install and overwrite smoke
        working-directory: web
        run: bun run smoke:dmg-install-mac
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Trowel-macos-arm64-candidate
          path: web/out/release/
          if-no-files-found: error
          retention-days: 7
