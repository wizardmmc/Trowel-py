name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "milestone-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Run backend tests
        run: uv run --no-sync python -m pytest --ignore=tests/contracts
      - name: Run Python lint
        run: uv run --no-sync ruff check trowel_py tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Run frontend typecheck
        run: bun run typecheck
      - name: Run frontend tests
        run: bun run test
      - name: Build frontend
        run: bun run build
      - name: Upload SPA contract input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist-index
          path: web/dist/index.html
          if-no-files-found: error
          retention-days: 1

  public-contracts:
    name: Public contracts
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download SPA contract input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-index
          path: web/dist
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Check public contracts
        run: uv run --no-sync python -m pytest tests/contracts
